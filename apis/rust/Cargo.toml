[package]
name = "open-equine-genetics"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "A small reader for the Open Equine Genetics genes/ and breeds/ JSON files"
publish = false

[lib]
name = "open_equine_genetics"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
